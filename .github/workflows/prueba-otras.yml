# Prueba real de las apps Tauri y Java de dsh-escritorio en Windows, Mac y Linux (rama de prueba, se borra después).
name: Prueba Tauri y Java
on:
  push:
    branches: [prueba-tauri-java]
jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        tec: [tauri, java]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.tec == 'tauri'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.tec == 'tauri' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb imagemagick
      - if: matrix.tec == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.tec == 'java' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - if: matrix.tec == 'java' && runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --version=3.14.1 -y --no-progress; echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH }
      - name: Crear la app de prueba
        run: node tests/ci/crear-demo.mjs demo ${{ matrix.tec }}
      - if: matrix.tec == 'tauri'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo/src-tauri
      - name: Dependencias
        working-directory: demo
        run: npm install --no-audit --no-fund
      - name: Probar (Tauri)
        if: matrix.tec == 'tauri'
        working-directory: demo
        shell: bash
        env:
          DSH_ESCRITORIO_SECRETOS: '{"con-clave.clave":"demo123"}'
        run: |
          node scripts/preparar.cjs
          npx tauri build --debug --no-bundle --config src-tauri/tauri.extra.json
          BIN=src-tauri/target/debug/textiles-x-demo
          export DSH_ESCRITORIO_PRUEBA="$PWD/.prueba"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a -s "-screen 0 1440x960x24" $BIN || true; else $BIN || true; fi
      - name: Probar (Java)
        if: matrix.tec == 'java'
        working-directory: demo
        shell: bash
        env:
          DSH_ESCRITORIO_SECRETOS: '{"con-clave.clave":"demo123"}'
        run: |
          node scripts/preparar.cjs
          export DSH_ESCRITORIO_PRUEBA="$PWD/.prueba"
          node scripts/java.cjs probar || true
      - name: Revisar el resultado
        run: node tests/ci/revisar.cjs demo
      - name: Instalador
        working-directory: demo
        shell: bash
        run: |
          if [ "${{ matrix.tec }}" = "tauri" ]; then
            case "$RUNNER_OS" in Windows) B=nsis;; macOS) B=dmg;; *) B=appimage,deb;; esac
            npx tauri build --config src-tauri/tauri.extra.json --bundles $B
            mkdir -p instaladores && find src-tauri/target/release/bundle \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} instaladores/ \;
          else
            node scripts/java.cjs empaquetar
            mkdir -p instaladores && cp paquete/instaladores/* instaladores/
          fi
          ls -la instaladores
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-${{ matrix.tec }}-${{ runner.os }}
          path: |
            demo/.prueba/*.png
            demo/.prueba/resultado.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.tec }}-${{ runner.os }}
          path: demo/instaladores/*
