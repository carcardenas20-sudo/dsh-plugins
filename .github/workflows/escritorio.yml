# Compila Academia para Windows, Mac y Linux en los servidores de GitHub (generado por dsh-escritorio).
# - Cada etiqueta escritorio-v1.2.3 publica la versión 1.2.3 en Releases con los instaladores y los
#   archivos latest*.yml: las apps ya instaladas la descargan solas y se actualizan al cerrarse.
# - "Run workflow" en la pestaña Actions compila sin publicar (los instaladores quedan en esa ejecución).
name: Escritorio

on:
  push:
    tags: ['escritorio-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de la interfaz
        run: npm install --no-audit --no-fund
        working-directory: ejemplos/academia
      - name: Dependencias de la app
        working-directory: ejemplos/academia/escritorio
        run: npm install --no-audit --no-fund
      - name: Interfaz
        working-directory: ejemplos/academia/escritorio
        run: npm run web
      - name: Versión desde la etiqueta
        if: startsWith(github.ref, 'refs/tags/escritorio-v')
        working-directory: ejemplos/academia/escritorio
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#escritorio-v}"
      - name: Mac sin Spotlight (evita que el .dmg quede "ocupado")
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - name: Instaladores
        working-directory: ejemplos/academia/escritorio
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          case "$RUNNER_OS" in Windows) P=--win;; macOS) P=--mac;; *) P=--linux;; esac
          npx electron-builder $P --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: academia-${{ runner.os }}
          path: |
            ejemplos/academia/escritorio/instaladores/*.exe
            ejemplos/academia/escritorio/instaladores/*.dmg
            ejemplos/academia/escritorio/instaladores/*.zip
            ejemplos/academia/escritorio/instaladores/*.AppImage
            ejemplos/academia/escritorio/instaladores/*.blockmap
            ejemplos/academia/escritorio/instaladores/latest*.yml
          if-no-files-found: error

  publicar:
    # Solo con etiqueta, y solo si las tres compilaciones salieron bien: así nunca queda una versión a medias.
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/escritorio-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Versión en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la salida
          V="${GITHUB_REF_NAME#escritorio-v}"
          gh release create "$GITHUB_REF_NAME" salida/* --repo "$GITHUB_REPOSITORY" --title "Academia $V" --latest \
            --notes "Instaladores de Academia $V. Windows: .exe · Mac: .dmg · Linux: .AppImage. Las apps ya instaladas se actualizan solas."
