# Compila Academia para Windows y Mac en los servidores de GitHub (generado por dsh-escritorio).
# - Cada vez que subas una etiqueta escritorio-v1.2.3 se crea una versión con los instaladores
#   y las apps instaladas se actualizan solas.
# - También se puede lanzar a mano desde la pestaña Actions ("Run workflow"): deja los instaladores
#   como archivos descargables de esa ejecución.
name: Escritorio

on:
  push:
    tags: ['escritorio-v*']
    branches: ['prueba-escritorio']   # solo para esta prueba: compila sin publicar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de la interfaz
        run: npm install --no-audit --no-fund
        working-directory: ejemplos/academia
      - name: Dependencias de la app
        working-directory: ejemplos/academia/escritorio
        run: npm install --no-audit --no-fund
      - name: Interfaz
        working-directory: ejemplos/academia/escritorio
        run: npm run web
      - name: Versión desde la etiqueta
        if: startsWith(github.ref, 'refs/tags/escritorio-v')
        working-directory: ejemplos/academia/escritorio
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#escritorio-v}"
      - name: Instaladores
        working-directory: ejemplos/academia/escritorio
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/escritorio-v* ]]; then PUB=always; else PUB=never; fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then npx electron-builder --win --publish $PUB; else npx electron-builder --mac --publish $PUB; fi
      - uses: actions/upload-artifact@v4
        with:
          name: academia-${{ runner.os }}
          path: |
            ejemplos/academia/escritorio/instaladores/*.exe
            ejemplos/academia/escritorio/instaladores/*.dmg
          if-no-files-found: error
